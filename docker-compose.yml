services:
  router:
    build: .
    ports:
      - "4010:4010"
    env_file:
      - path: .env
        required: false
    environment:
      ROUTER_DB_PATH: /data/router.db
    volumes:
      - router-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4010/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bifrost:
    image: maximhq/bifrost:latest
    profiles: ["bifrost"]
    ports:
      - "8080:8080"
    volumes:
      - bifrost-data:/app/data
    restart: unless-stopped

volumes:
  router-data:
  bifrost-data:
