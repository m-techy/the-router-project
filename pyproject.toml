[project]
name = "the-router-project"
version = "0.4.0"
description = "Plug-and-play free-tier-aware AI router with an OpenAI-compatible API, dashboard, playground, quota tracking, request traces, and provider health certification."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0","pytest-asyncio>=0.23","respx>=0.21","ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.vercel]
entrypoint = "app.main:app"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
