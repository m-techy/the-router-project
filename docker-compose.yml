services:
  router:
    build: .
    ports:
      - "4010:4010"
    env_file:
      - .env
    environment:
      ROUTER_DB_PATH: /data/router.db
    volumes:
      - router-data:/data
    restart: unless-stopped

  bifrost:
    image: maximhq/bifrost:latest
    profiles: ["bifrost"]
    ports:
      - "8080:8080"
    volumes:
      - bifrost-data:/app/data
    restart: unless-stopped

volumes:
  router-data:
  bifrost-data:
