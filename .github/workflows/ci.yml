name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/router_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Lint correctness
        run: ruff check --select E9,F63,F7,F82 app tests scripts
      - name: Validate browser JavaScript
        run: |
          node --check app/static/app.js
          if [ -f app/static/hosted.js ]; then node --check app/static/hosted.js; fi
          if [ -f app/static/motion.js ]; then node --check app/static/motion.js; fi
      - name: Validate local launch and install scripts
        run: |
          bash -n start.sh
          bash -n start-docker.sh
          bash -n install.sh
      - name: Validate provider registry
        run: python scripts/validate_registry.py
      - name: Build registry release bundle
        run: python scripts/build_registry_release.py
      - run: pytest -q
